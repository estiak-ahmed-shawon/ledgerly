<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgerly — Money Management</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#687386;--line:#e5e9f0;--brand:#3157d5;--brand2:#e9edff;--green:#16845b;--red:#c34242;--amber:#a66b00;--shadow:0 8px 26px #1c2b4b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:var(--brand);color:white}.secondary{background:#eef1f7;color:#26334b}.danger{background:#fff0f0;color:var(--red)}.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#111a2d;color:#e9eefb;padding:24px 15px;display:flex;flex-direction:column;gap:20px}.logo{font-size:21px;font-weight:800;letter-spacing:-.6px;padding:0 12px}.logo span{color:#8ea5ff}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#8792aa;padding:4px 12px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#bac4d8;text-align:left;font-weight:550;padding:11px 12px;border-radius:8px}.nav button.active,.nav button:hover{background:#273452;color:white}.nav .ico{display:inline-block;width:25px}.side-note{margin-top:auto;font-size:12px;color:#9eabc2;padding:12px;line-height:1.6}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.topbar h1{font-size:18px;margin:0}.top-actions{display:flex;gap:9px;align-items:center}.content{padding:27px 30px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:750}.page-title{font-size:26px;letter-spacing:-.8px;margin:4px 0 5px}.sub{color:var(--muted);margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:18px 0 22px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:18px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.metric-icon{background:#eef1ff;color:var(--brand);padding:7px;border-radius:8px}.metric-value{font-size:25px;font-weight:780;letter-spacing:-.7px;margin:13px 0 4px;overflow-wrap:anywhere}.metric-foot{font-size:12px;color:var(--muted)}.green{color:var(--green)!important}.red{color:var(--red)!important}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:17px}.panel{padding:20px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel h3{font-size:15px;margin:0}.panel p.hint{font-size:12px;color:var(--muted);margin:4px 0 0}.chart{height:225px;display:flex;align-items:end;gap:12px;padding:16px 4px 0;border-bottom:1px solid var(--line)}.bar-group{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;height:100%;gap:8px;min-width:0}.bar-pair{display:flex;gap:4px;align-items:end;height:170px;width:100%;justify-content:center}.bar{width:min(35%,24px);min-height:2px;border-radius:5px 5px 0 0;background:#4568e8}.bar.exp{background:#d7def8}.bar-label{font-size:10px;color:var(--muted)}.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}.progress-row{margin:15px 0}.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}.track{height:7px;background:#edf0f5;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;background:var(--brand)}.fill.warn{background:#e5a63b}.fill.over{background:#d34c4c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:750;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eef0f4;font-size:12px}tbody tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;background:#edf0f6;color:#556176;font-size:10px;font-weight:700}.pill.income{background:#e6f6ef;color:#14724f}.pill.expense{background:#fff0ee;color:#b63c36}.pill.transfer{background:#eaf0ff;color:#3157d5}.amount{font-weight:750}.empty{text-align:center;padding:28px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{width:auto;min-width:140px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#445066}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:10px 11px;border:1px solid #dce1eb;border-radius:8px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#8197f4;box-shadow:0 0 0 3px #e7ebff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#0c1428a3;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 24px 90px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-size:19px;margin:0}.close{font-size:20px;background:#f0f2f7;padding:5px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:20}.toast.show{display:block}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.notice{background:#f0f4ff;border:1px solid #dce4ff;padding:13px 15px;border-radius:10px;color:#34456e;font-size:12px;margin-bottom:18px}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini-stat{padding:12px;background:#f7f8fb;border-radius:9px}.mini-stat small{display:block;color:var(--muted);margin-bottom:5px}.mini-stat strong{font-size:17px}.mobile-menu{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}.app{grid-template-columns:205px minmax(0,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.mobile-menu{display:inline-block}.topbar{height:62px}.topbar h1{font-size:16px}.top-actions .hide-mobile{display:none}.content{padding:18px 13px}.page-title{font-size:23px}.cards{gap:9px}.metric{padding:13px}.metric-value{font-size:20px}.metric-top{font-size:11px}.panel{padding:14px}.settings-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.mini-stats{grid-template-columns:1fr}.filters input,.filters select{min-width:100px}.top-actions button{padding:9px}.side-mobile{display:flex!important;position:fixed;z-index:8;top:62px;left:0;right:0;background:#111a2d;padding:12px;max-height:70vh;overflow:auto}.side-mobile .nav{grid-template-columns:1fr 1fr}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111a2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo">ledger<span>ly.</span></div>
  <div><div class="side-label">Workspace</div><nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Overview</button>
  <button data-page="transactions"><span class="ico">↕</span>Transactions</button>
  <button data-page="accounts"><span class="ico">▣</span>Accounts</button>
  <button data-page="budgets"><span class="ico">◴</span>Budgets</button>
  <button data-page="savings"><span class="ico">◈</span>Savings goals</button>
  <button data-page="debts"><span class="ico">⇄</span>Debts & loans</button>
  <button data-page="recurring"><span class="ico">⟳</span>Recurring</button>
  <button data-page="reports"><span class="ico">▤</span>Reports</button>
  </nav></div>
  <div><div class="side-label">Manage</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings & backup</button></nav></div>
  <div class="side-note">Your finances, organized.<br>Data is stored locally in this browser.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobile-menu" id="mobileMenu">☰</button><div><h1 id="topTitle">Overview</h1><div style="font-size:11px;color:var(--muted)">Personal + business finance</div></div></div><div class="top-actions"><select id="globalCurrency" aria-label="Display currency" style="border:1px solid var(--line);border-radius:8px;padding:9px;background:white"><option>BDT</option><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>JPY</option><option>CAD</option><option>AUD</option><option>SGD</option><option>MYR</option><option>SAR</option><option>AED</option></select><button class="secondary hide-mobile" id="exportTop">Export CSV</button><button class="primary" id="addTop">+ Add transaction</button></div></header>
<div class="content" id="content"></div>
</main></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add transaction</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=> {
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const currencies=['BDT','USD','EUR','GBP','INR','JPY','CAD','AUD','SGD','MYR','SAR','AED','CNY','CHF','NZD'];
const symbols={BDT:'৳',USD:'$',EUR:'€',GBP:'£',INR:'₹',JPY:'¥',CAD:'CA$',AUD:'A$',SGD:'S$',MYR:'RM',SAR:'SAR ',AED:'AED ',CNY:'¥',CHF:'CHF ',NZD:'NZ$'};
const today=()=>new Date().toISOString().slice(0,10), month=()=>today().slice(0,7), uid=()=>Math.random().toString(36).slice(2,10);
const seed=()=>({version:1,baseCurrency:'BDT',transactions:[
{id:uid(),date:today(),type:'income',amount:85000,currency:'BDT',account:'Salary Account',category:'Salary',scope:'Personal',note:'Monthly salary'},
{id:uid(),date:today(),type:'expense',amount:8500,currency:'BDT',account:'Cash Wallet',category:'Food & dining',scope:'Personal',note:'Groceries and meals'},
{id:uid(),date:today(),type:'expense',amount:3200,currency:'BDT',account:'Salary Account',category:'Utilities',scope:'Personal',note:'Utility bills'},
{id:uid(),date:today(),type:'income',amount:25000,currency:'BDT',account:'Business Account',category:'Client payment',scope:'Business',note:'Project income'},
{id:uid(),date:today(),type:'expense',amount:7000,currency:'BDT',account:'Business Account',category:'Software',scope:'Business',note:'Tools and subscriptions'}],
accounts:[{id:uid(),name:'Salary Account',type:'Bank',currency:'BDT',opening:125000,scope:'Personal'},{id:uid(),name:'Cash Wallet',type:'Cash',currency:'BDT',opening:5000,scope:'Personal'},{id:uid(),name:'Business Account',type:'Bank',currency:'BDT',opening:45000,scope:'Business'}],
budgets:[{id:uid(),name:'Food & dining',amount:12000,currency:'BDT',scope:'Personal',period:'Monthly'},{id:uid(),name:'Transport',amount:6000,currency:'BDT',scope:'Personal',period:'Monthly'},{id:uid(),name:'Utilities',amount:5000,currency:'BDT',scope:'Personal',period:'Monthly'},{id:uid(),name:'Software',amount:10000,currency:'BDT',scope:'Business',period:'Monthly'}],
goals:[{id:uid(),name:'Emergency fund',target:300000,saved:65000,currency:'BDT',due:'',scope:'Personal'}],
debts:[{id:uid(),name:'Personal loan',kind:'Owed by me',principal:150000,balance:95000,currency:'BDT',due:'',rate:0,scope:'Personal'}],
recurring:[{id:uid(),name:'Monthly salary',type:'income',amount:85000,currency:'BDT',category:'Salary',account:'Salary Account',scope:'Personal',frequency:'Monthly',nextDate:today(),active:true}],
rates:{BDT:1,USD:0.0082,EUR:0.0075,GBP:0.0064,INR:0.71,JPY:1.22,CAD:0.0112,AUD:0.0125,SGD:0.011,MYR:0.035,SAR:0.0308,AED:0.0301,CNY:0.059,CHF:0.0072,NZD:0.0135}});
let data;
try{data=JSON.parse(localStorage.getItem('ledgerlyData'))||seed()}catch(e){data=seed()}
let page='dashboard', transactionFilter='all', searchTerm='', monthFilter=month();
function save(){localStorage.setItem('ledgerlyData',JSON.stringify(data))}
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v)||0}
function toBase(amount,cur){return num(amount)/(num(data.rates[cur])||1)}
function convert(amount,cur,target=$('#globalCurrency')?.value||data.baseCurrency){return toBase(amount,cur)*(num(data.rates[target])||1)}
function money(amount,cur=$('#globalCurrency')?.value||data.baseCurrency){let val=convert(amount,cur,cur);return (symbols[cur]||cur+' ')+Math.abs(val).toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2})}
function signedMoney(amount,cur){return (amount<0?'-':'+')+money(Math.abs(amount),cur)}
function selectedTransactions(){return data.transactions.filter(t=>t.date?.slice(0,7)===monthFilter)}
function currentAccountBalance(a){let bal=num(a.opening);data.transactions.forEach(t=>{if(t.account===a.name&&t.currency===a.currency){if(t.type==='income')bal+=num(t.amount);if(t.type==='expense')bal-=num(t.amount)}});return bal}
function sumTx(tx,type){return tx.filter(t=>t.type===type).reduce((s,t)=>s+convert(t.amount,t.currency),0)}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400)}
function setPage(p){page=p;$('#topTitle').textContent=({dashboard:'Overview',transactions:'Transactions',accounts:'Accounts',budgets:'Budgets',savings:'Savings goals',debts:'Debts & loans',recurring:'Recurring transactions',reports:'Reports',settings:'Settings & backup'})[p]||p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('side-mobile');render()}
function nav(){ $$('#nav [data-page], [data-page="settings"]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));}
function pageIntro(title,sub,button=''){return `<div class="section-head"><div><div class="eyebrow">Ledgerly workspace</div><div class="page-title">${title}</div><p class="sub">${sub}</p></div>${button}</div>`}
function metric(label,value,foot,icon,cls=''){return `<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value ${cls}">${value}</div><div class="metric-foot">${foot}</div></div>`}
function txTable(rows,limit=Infinity){let list=rows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'' )).slice(0,limit);if(!list.length)return `<div class="empty">No transactions match this view.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th>Scope</th><th>Amount</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td>${escape(t.date)}</td><td><strong>${escape(t.note||t.category||t.type)}</strong><div style="color:var(--muted);font-size:10px">${escape(t.currency)} · ${escape(t.type)}</div></td><td>${escape(t.category)}</td><td>${escape(t.account||'—')}</td><td>${escape(t.scope||'Personal')}</td><td class="amount ${t.type==='income'?'green':t.type==='expense'?'red':''}">${t.type==='expense'?'-':t.type==='income'?'+':''}${money(t.amount,t.currency)}</td><td><button class="secondary small" onclick="editTx('${t.id}')">Edit</button> <button class="danger small" onclick="deleteTx('${t.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function categorySpend(tx){let o={};tx.filter(t=>t.type==='expense').forEach(t=>o[t.category||'Other']=(o[t.category||'Other']||0)+convert(t.amount,t.currency));return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function chart(tx){let months=[];let d=new Date();for(let i=5;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({key:x.toISOString().slice(0,7),label:x.toLocaleString(undefined,{month:'short'}),inc:0,exp:0})}months.forEach(m=>tx.filter(t=>t.date?.slice(0,7)===m.key).forEach(t=>{if(t.type==='income')m.inc+=convert(t.amount,t.currency);if(t.type==='expense')m.exp+=convert(t.amount,t.currency)}));let max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));return `<div class="chart">${months.map(m=>`<div class="bar-group"><div class="bar-pair"><div class="bar" title="Income ${money(m.inc)}" style="height:${Math.max(2,m.inc/max*100)}%"></div><div class="bar exp" title="Expenses ${money(m.exp)}" style="height:${Math.max(2,m.exp/max*100)}%"></div></div><div class="bar-label">${m.label}</div></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#4568e8"></i>Income</span><span><i class="dot" style="background:#d7def8"></i>Expenses</span></div>`}
function budgetRows(){let tx=selectedTransactions();return data.budgets.map(b=>{let spent=tx.filter(t=>t.type==='expense'&&t.category===b.name&&t.scope===b.scope).reduce((s,t)=>s+convert(t.amount,t.currency),0),amt=convert(b.amount,b.currency),pct=amt?spent/amt*100:0;return `<div class="progress-row"><div class="progress-meta"><span><strong>${escape(b.name)}</strong> <span class="pill">${escape(b.scope)}</span></span><span>${money(spent)} / ${money(amt)}</span></div><div class="track"><div class="fill ${pct>=100?'over':pct>=80?'warn':''}" style="width:${Math.min(100,pct)}%"></div></div></div>`}).join('')||'<div class="empty">Add a budget to track spending.</div>'}
function renderDashboard(){let tx=selectedTransactions(),inc=sumTx(tx,'income'),exp=sumTx(tx,'expense'),net=inc-exp,accounts=data.accounts.reduce((s,a)=>s+convert(currentAccountBalance(a),a.currency),0),monthName=new Date(monthFilter+'-02').toLocaleString(undefined,{month:'long',year:'numeric'});return `${pageIntro('Your money at a glance',`A clear picture of ${monthName}. All figures are converted using your configured rates.`,`<input type="month" id="dashMonth" value="${monthFilter}" style="padding:10px;border:1px solid var(--line);border-radius:9px">`)}<div class="notice">Demo data is included so you can explore the app. Replace it with your own records. Currency conversion uses editable sample rates, not live market rates.</div><div class="cards">${metric('Income this month',money(inc),'Recorded income','↗','green')}${metric('Expenses this month',money(exp),'Recorded spending','↘','red')}${metric('Net cash flow',money(net),net>=0?'Income exceeds expenses':'Expenses exceed income','≈',net>=0?'green':'red')}${metric('Tracked account balances',money(accounts),`${data.accounts.length} accounts tracked`,'▣')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Cash flow</h3><p class="hint">Income and expenses · last 6 months</p></div></div>${chart(data.transactions)}</section><section class="panel"><div class="panel-head"><div><h3>Budget progress</h3><p class="hint">Spending in the selected month</p></div><button class="secondary small" onclick="go('budgets')">View budgets</button></div>${budgetRows()}</section></div><section class="panel" style="margin-top:17px"><div class="panel-head"><div><h3>Recent transactions</h3><p class="hint">Latest recorded activity</p></div><button class="secondary small" onclick="go('transactions')">View all</button></div>${txTable(data.transactions,6)}</section>`}
function renderTransactions(){let rows=data.transactions.filter(t=>(transactionFilter==='all'||t.type===transactionFilter)&&(!searchTerm||[t.note,t.category,t.account,t.scope].join(' ').toLowerCase().includes(searchTerm.toLowerCase()))&&(!monthFilter||t.date?.startsWith(monthFilter)));return `${pageIntro('Transactions','Record and review income, spending, and transfers.','<button class="primary" onclick="openTx()">+ Add transaction</button>')}<div class="panel"><div class="section-head"><div class="filters"><input id="txSearch" placeholder="Search description, category…" value="${escape(searchTerm)}"><select id="txType"><option value="all">All types</option><option value="income" ${transactionFilter==='income'?'selected':''}>Income</option><option value="expense" ${transactionFilter==='expense'?'selected':''}>Expense</option><option value="transfer" ${transactionFilter==='transfer'?'selected':''}>Transfer</option></select><input type="month" id="txMonth" value="${monthFilter}"></div><button class="secondary" onclick="exportCSV()">Export CSV</button></div>${txTable(rows)}</div>`}
function renderAccounts(){return `${pageIntro('Accounts','Track cash, bank accounts, cards, and wallets by currency.','<button class="primary" onclick="openAccount()">+ Add account</button>')}<div class="cards">${metric('Accounts',data.accounts.length,'Personal and business','▣')}${metric('Personal accounts',data.accounts.filter(a=>a.scope==='Personal').length,'Tracked accounts','⌂')}${metric('Business accounts',data.accounts.filter(a=>a.scope==='Business').length,'Tracked accounts','▤')}${metric('Currencies used',new Set(data.accounts.map(a=>a.currency)).size,'Across accounts','◎')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th>Scope</th><th>Currency</th><th>Opening balance</th><th>Current balance</th><th></th></tr></thead><tbody>${data.accounts.map(a=>`<tr><td><strong>${escape(a.name)}</strong></td><td>${escape(a.type)}</td><td>${escape(a.scope)}</td><td>${a.currency}</td><td>${money(a.opening,a.currency)}</td><td class="amount">${money(currentAccountBalance(a),a.currency)}</td><td><button class="secondary small" onclick="editAccount('${a.id}')">Edit</button> <button class="danger small" onclick="removeItem('accounts','${a.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No accounts yet.</td></tr>'}</tbody></table></div><p class="hint">Account balances are calculated from opening balance and matching income/expense transactions. Transfers and foreign-exchange conversions are not yet reconciled automatically.</p></section>`}
function renderBudgets(){return `${pageIntro('Budgets','Set monthly spending limits by category and personal/business scope.','<button class="primary" onclick="openBudget()">+ Add budget</button>')}<div class="panel"><div class="panel-head"><h3>Budget progress</h3><input type="month" id="budgetMonth" value="${monthFilter}" style="max-width:170px;padding:9px;border:1px solid var(--line);border-radius:8px"></div>${budgetRows()}<div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Category</th><th>Scope</th><th>Period</th><th>Limit</th><th></th></tr></thead><tbody>${data.budgets.map(b=>`<tr><td><strong>${escape(b.name)}</strong></td><td>${escape(b.scope)}</td><td>${escape(b.period)}</td><td>${money(b.amount,b.currency)}</td><td><button class="secondary small" onclick="editBudget('${b.id}')">Edit</button> <button class="danger small" onclick="removeItem('budgets','${b.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No budgets added.</td></tr>'}</tbody></table></div></div>`}
function renderSavings(){return `${pageIntro('Savings goals','Give your savings a purpose and track progress toward each target.','<button class="primary" onclick="openGoal()">+ Add goal</button>')}<div class="cards">${metric('Goals',data.goals.length,'Active savings targets','◈')}${metric('Total saved',money(data.goals.reduce((s,g)=>s+convert(g.saved,g.currency),0)),'Across all goals','✓','green')}${metric('Total target',money(data.goals.reduce((s,g)=>s+convert(g.target,g.currency),0)),'Combined goal value','◎')}${metric('Remaining',money(data.goals.reduce((s,g)=>s+convert(Math.max(0,g.target-g.saved),g.currency),0)),'To reach all targets','→')}</div><div class="grid2">${data.goals.map(g=>{let pct=g.target?g.saved/g.target*100:0;return `<section class="panel"><div class="panel-head"><div><h3>${escape(g.name)}</h3><p class="hint">${escape(g.scope)} ${g.due?'· Due '+escape(g.due):''}</p></div><button class="secondary small" onclick="editGoal('${g.id}')">Edit</button></div><div class="metric-value">${money(g.saved,g.currency)} <span style="font-size:12px;color:var(--muted);font-weight:500">of ${money(g.target,g.currency)}</span></div><div class="track" style="margin:16px 0 8px"><div class="fill" style="width:${Math.min(100,pct)}%"></div></div><div class="metric-foot">${pct.toFixed(1)}% completed · ${money(Math.max(0,g.target-g.saved),g.currency)} remaining</div><div style="margin-top:15px"><button class="primary small" onclick="contributeGoal('${g.id}')">+ Add savings</button> <button class="danger small" onclick="removeItem('goals','${g.id}')">Delete</button></div></section>`}).join('')||'<div class="panel empty">Add your first savings goal.</div>'}</div>`}
function renderDebts(){return `${pageIntro('Debts & loans','Track money you owe and money owed to you.','<button class="primary" onclick="openDebt()">+ Add debt</button>')}<div class="cards">${metric('You owe',money(data.debts.filter(d=>d.kind==='Owed by me').reduce((s,d)=>s+convert(d.balance,d.currency),0)),'Outstanding liabilities','↘','red')}${metric('Owed to you',money(data.debts.filter(d=>d.kind==='Owed to me').reduce((s,d)=>s+convert(d.balance,d.currency),0)),'Receivables','↗','green')}${metric('Debt records',data.debts.length,'Loans and balances','⇄')}${metric('Principal recorded',money(data.debts.reduce((s,d)=>s+convert(d.principal,d.currency),0)),'Original amounts','◎')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Debt / loan</th><th>Type</th><th>Scope</th><th>Currency</th><th>Principal</th><th>Balance</th><th>Rate</th><th></th></tr></thead><tbody>${data.debts.map(d=>`<tr><td><strong>${escape(d.name)}</strong><div style="font-size:10px;color:var(--muted)">${d.due?'Due '+escape(d.due):'No due date'}</div></td><td>${escape(d.kind)}</td><td>${escape(d.scope)}</td><td>${d.currency}</td><td>${money(d.principal,d.currency)}</td><td class="amount">${money(d.balance,d.currency)}</td><td>${num(d.rate)}%</td><td><button class="secondary small" onclick="editDebt('${d.id}')">Edit</button> <button class="danger small" onclick="removeItem('debts','${d.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No debts recorded.</td></tr>'}</tbody></table></div></section>`}
function renderRecurring(){return `${pageIntro('Recurring transactions','Plan repeating income and expenses. This version tracks schedules but does not automatically post transactions.','<button class="primary" onclick="openRecurring()">+ Add schedule</button>')}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Schedule</th><th>Type</th><th>Amount</th><th>Frequency</th><th>Next date</th><th>Scope</th><th>Status</th><th></th></tr></thead><tbody>${data.recurring.map(r=>`<tr><td><strong>${escape(r.name)}</strong><div style="font-size:10px;color:var(--muted)">${escape(r.category)}</div></td><td><span class="pill ${r.type}">${escape(r.type)}</span></td><td class="amount">${money(r.amount,r.currency)}</td><td>${escape(r.frequency)}</td><td>${escape(r.nextDate)}</td><td>${escape(r.scope)}</td><td><span class="pill">${r.active?'Active':'Paused'}</span></td><td><button class="secondary small" onclick="editRecurring('${r.id}')">Edit</button> <button class="secondary small" onclick="toggleRecurring('${r.id}')">${r.active?'Pause':'Resume'}</button> <button class="danger small" onclick="removeItem('recurring','${r.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No recurring schedules yet.</td></tr>'}</tbody></table></div></section>`}
function renderReports(){let tx=data.transactions.filter(t=>!monthFilter||t.date?.startsWith(monthFilter)),inc=sumTx(tx,'income'),exp=sumTx(tx,'expense'),cats=categorySpend(tx),total=cats.reduce((s,c)=>s+c[1],0);return `${pageIntro('Reports & insights','Review cash flow, category spending, and transaction history.','<button class="secondary" onclick="exportCSV()">Export transactions CSV</button>')}<div class="section-head"><div class="filters"><label style="font-size:12px;align-self:center">Reporting month</label><input type="month" id="reportMonth" value="${monthFilter}"></div><button class="secondary" onclick="exportJSON()">Download full backup</button></div><div class="cards">${metric('Income',money(inc),'Selected month','↗','green')}${metric('Expenses',money(exp),'Selected month','↘','red')}${metric('Net cash flow',money(inc-exp),'Income minus expenses','≈',inc>=exp?'green':'red')}${metric('Transactions',tx.length,'Selected month','▤')}</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Six-month cash flow</h3></div>${chart(data.transactions)}</section><section class="panel"><div class="panel-head"><h3>Spending by category</h3></div>${cats.map(([name,val])=>`<div class="progress-row"><div class="progress-meta"><span>${escape(name)}</span><strong>${money(val)}</strong></div><div class="track"><div class="fill" style="width:${total?val/total*100:0}%"></div></div><div class="metric-foot">${total?(val/total*100).toFixed(1):0}% of expenses</div></div>`).join('')||'<div class="empty">No expense data for this month.</div>'}</section></div><section class="panel" style="margin-top:17px"><div class="panel-head"><h3>Transactions included in report</h3></div>${txTable(tx)}</section>`}
function renderSettings(){return `${pageIntro('Settings & backup','Configure currency rates and manage your local data.')}<div class="notice"><strong>Privacy:</strong> Your records are stored in this browser using localStorage. They are not uploaded to a server. Clearing browser data can erase them, so export backups regularly. This prototype has no user accounts, cloud sync, or bank connections.</div><div class="settings-grid"><section class="panel"><div class="panel-head"><h3>Currency & conversion rates</h3></div><div class="field"><label>Default currency</label><select id="baseCur">${currencies.map(c=>`<option ${data.baseCurrency===c?'selected':''}>${c}</option>`).join('')}</select></div><p class="hint">Rates are units of currency per 1 BDT (example: USD 0.0082). These starter rates are illustrative. Update them manually to reflect your preferred exchange rates.</p><div class="form-grid" style="margin-top:14px">${currencies.map(c=>`<div class="field"><label>${c}</label><input type="number" step="0.000001" min="0.000001" id="rate_${c}" value="${num(data.rates[c])||1}"></div>`).join('')}</div><button class="primary" onclick="saveRates()">Save settings</button></section><section class="panel"><div class="panel-head"><h3>Backup & restore</h3></div><p class="hint">Export your complete data as JSON to back it up. Restore only a file you trust.</p><div style="display:grid;gap:10px;margin:18px 0"><button class="primary" onclick="exportJSON()">Download full backup (.json)</button><button class="secondary" onclick="exportCSV()">Export transactions (.csv)</button><label class="secondary" style="text-align:center;cursor:pointer;border-radius:9px;padding:10px 14px;font-weight:650">Restore from JSON<input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div><div class="notice">Importing a backup replaces the current data in this browser. Export a backup first if you want to keep the current records.</div><button class="danger" onclick="resetDemo()">Reset to demo data</button></section></div>`}
function render(){let html=({dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,budgets:renderBudgets,savings:renderSavings,debts:renderDebts,recurring:renderRecurring,reports:renderReports,settings:renderSettings})[page]();$('#content').innerHTML=html;let dm=$('#dashMonth');if(dm)dm.onchange=e=>{monthFilter=e.target.value||month();render()};let tm=$('#txMonth');if(tm)tm.onchange=e=>{monthFilter=e.target.value||month();render()};let ts=$('#txSearch');if(ts)ts.oninput=e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;render();$('#txSearch').focus();$('#txSearch').setSelectionRange(pos,pos)};let tt=$('#txType');if(tt)tt.onchange=e=>{transactionFilter=e.target.value;render()};let bm=$('#budgetMonth');if(bm)bm.onchange=e=>{monthFilter=e.target.value||month();render()};let rm=$('#reportMonth');if(rm)rm.onchange=e=>{monthFilter=e.target.value||month();render()};let bc=$('#baseCur');if(bc)bc.onchange=e=>data.baseCurrency=e.target.value}
window.go=setPage;
function options(vals,selected){return vals.map(v=>`<option ${v===selected?'selected':''}>${escape(v)}</option>`).join('')}
function field(label,name,value='',type='text',opts=null,required=false){return `<div class="field"><label for="${name}">${label}</label>${opts?`<select id="${name}" name="${name}" ${required?'required':''}>${opts.map(v=>`<option ${v===value?'selected':''}>${escape(v)}</option>`).join('')}</select>`:`<input id="${name}" name="${name}" type="${type}" value="${escape(value)}" ${required?'required':''} ${type==='number'?'step="any"':''}>`}</div>`}
function modal(title,body,saveFn,label='Save'){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body+`<div class="modal-actions"><button class="secondary" type="button" id="cancelModal">Cancel</button><button class="primary" type="button" id="saveModal">${label}</button></div>`;$('#modalBackdrop').classList.add('show');$('#cancelModal').onclick=closeModal;$('#saveModal').onclick=()=>{let obj={};$$('#modalBody [name]').forEach(el=>obj[el.name]=el.value);if(!$('#modalBody form').reportValidity())return;saveFn(obj)}}
function closeModal(){$('#modalBackdrop').classList.remove('show')}$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
const scopes=['Personal','Business'], accountNames=()=>data.accounts.map(a=>a.name), categories=['Salary','Freelance','Client payment','Investment','Gift','Food & dining','Transport','Housing','Utilities','Healthcare','Shopping','Education','Software','Office supplies','Marketing','Travel','Taxes','Debt repayment','Savings','Other'];
function openTx(id=null){let t=id?data.transactions.find(x=>x.id===id):{date:today(),type:'expense',amount:'',currency:$('#globalCurrency').value,account:accountNames()[0]||'',category:'Food & dining',scope:'Personal',note:''};modal(id?'Edit transaction':'Add transaction',`<form id="txForm" onsubmit="return false"><div class="form-grid">${field('Type','type',t.type,'text',['income','expense','transfer'],true)}${field('Date','date',t.date,'date',null,true)}${field('Amount','amount',t.amount,'number',null,true)}${field('Currency','currency',t.currency,'text',currencies,true)}${field('Category','category',t.category,'text',categories,true)}${field('Account','account',t.account,'text',accountNames(),false)}${field('Scope','scope',t.scope,'text',scopes,true)}<div class="field full"><label for="note">Description / note</label><input id="note" name="note" value="${escape(t.note)}" placeholder="What was this transaction for?"></div></div></form>`,o=>{if(num(o.amount)<=0){toast('Amount must be greater than zero');return}let next={...t,...o,amount:num(o.amount),id:t.id||uid()};if(id)data.transactions=data.transactions.map(x=>x.id===id?next:x);else data.transactions.unshift(next);save();closeModal();render();toast('Transaction saved')})}
window.openTx=openTx;window.editTx=id=>openTx(id);window.deleteTx=id=>{if(confirm('Delete this transaction?')){data.transactions=data.transactions.filter(t=>t.id!==id);save();render();toast('Transaction deleted')}};
function openAccount(id=null){let a=id?data.accounts.find(x=>x.id===id):{name:'',type:'Bank',currency:$('#globalCurrency').value,opening:0,scope:'Personal'};modal(id?'Edit account':'Add account',`<form onsubmit="return false"><div class="form-grid">${field('Account name','name',a.name,'text',null,true)}${field('Account type','type',a.type,'text',['Bank','Cash','Credit card','Mobile wallet','Investment','Other'],true)}${field('Currency','currency',a.currency,'text',currencies,true)}${field('Opening balance','opening',a.opening,'number',null,true)}${field('Scope','scope',a.scope,'text',scopes,true)}</div></form>`,o=>{if(!o.name.trim()){toast('Enter an account name');return}let n={...a,...o,opening:num(o.opening),id:a.id||uid()};if(id)data.accounts=data.accounts.map(x=>x.id===id?n:x);else data.accounts.push(n);save();closeModal();render();toast('Account saved')})}
window.openAccount=openAccount;window.editAccount=id=>openAccount(id);
function openBudget(id=null){let b=id?data.budgets.find(x=>x.id===id):{name:'',amount:'',currency:$('#globalCurrency').value,scope:'Personal',period:'Monthly'};modal(id?'Edit budget':'Add budget',`<form onsubmit="return false"><div class="form-grid">${field('Category name','name',b.name,'text',categories,true)}${field('Monthly limit','amount',b.amount,'number',null,true)}${field('Currency','currency',b.currency,'text',currencies,true)}${field('Scope','scope',b.scope,'text',scopes,true)}${field('Period','period',b.period,'text',['Monthly','Weekly','Yearly'],true)}</div></form>`,o=>{let n={...b,...o,amount:num(o.amount),id:b.id||uid()};if(id)data.budgets=data.budgets.map(x=>x.id===id?n:x);else data.budgets.push(n);save();closeModal();render();toast('Budget saved')})}
window.openBudget=openBudget;window.editBudget=id=>openBudget(id);
function openGoal(id=null){let g=id?data.goals.find(x=>x.id===id):{name:'',target:'',saved:0,currency:$('#globalCurrency').value,due:'',scope:'Personal'};modal(id?'Edit savings goal':'Add savings goal',`<form onsubmit="return false"><div class="form-grid">${field('Goal name','name',g.name,'text',null,true)}${field('Target amount','target',g.target,'number',null,true)}${field('Already saved','saved',g.saved,'number',null,true)}${field('Currency','currency',g.currency,'text',currencies,true)}${field('Target date','due',g.due,'date')}${field('Scope','scope',g.scope,'text',scopes,true)}</div></form>`,o=>{let n={...g,...o,target:num(o.target),saved:num(o.saved),id:g.id||uid()};if(id)data.goals=data.goals.map(x=>x.id===id?n:x);else data.goals.push(n);save();closeModal();render();toast('Savings goal saved')})}
window.openGoal=openGoal;window.editGoal=id=>openGoal(id);window.contributeGoal=id=>{let g=data.goals.find(x=>x.id===id),v=prompt(`How much would you like to add to ${g.name}? (${g.currency})`);if(v!==null&&num(v)>0){g.saved=num(g.saved)+num(v);save();render();toast('Savings updated')}};
function openDebt(id=null){let d=id?data.debts.find(x=>x.id===id):{name:'',kind:'Owed by me',principal:'',balance:'',currency:$('#globalCurrency').value,due:'',rate:0,scope:'Personal'};modal(id?'Edit debt':'Add debt / loan',`<form onsubmit="return false"><div class="form-grid">${field('Name','name',d.name,'text',null,true)}${field('Type','kind',d.kind,'text',['Owed by me','Owed to me'],true)}${field('Original principal','principal',d.principal,'number',null,true)}${field('Outstanding balance','balance',d.balance,'number',null,true)}${field('Currency','currency',d.currency,'text',currencies,true)}${field('Annual interest rate (%)','rate',d.rate,'number',null,false)}${field('Due date','due',d.due,'date')}${field('Scope','scope',d.scope,'text',scopes,true)}</div></form>`,o=>{let n={...d,...o,principal:num(o.principal),balance:num(o.balance),rate:num(o.rate),id:d.id||uid()};if(id)data.debts=data.debts.map(x=>x.id===id?n:x);else data.debts.push(n);save();closeModal();render();toast('Debt saved')})}
window.openDebt=openDebt;window.editDebt=id=>openDebt(id);
function openRecurring(id=null){let r=id?data.recurring.find(x=>x.id===id):{name:'',type:'expense',amount:'',currency:$('#globalCurrency').value,category:'Utilities',account:accountNames()[0]||'',scope:'Personal',frequency:'Monthly',nextDate:today(),active:true};modal(id?'Edit recurring schedule':'Add recurring schedule',`<form onsubmit="return false"><div class="form-grid">${field('Schedule name','name',r.name,'text',null,true)}${field('Type','type',r.type,'text',['income','expense'],true)}${field('Amount','amount',r.amount,'number',null,true)}${field('Currency','currency',r.currency,'text',currencies,true)}${field('Category','category',r.category,'text',categories,true)}${field('Account','account',r.account,'text',accountNames(),false)}${field('Scope','scope',r.scope,'text',scopes,true)}${field('Frequency','frequency',r.frequency,'text',['Daily','Weekly','Monthly','Quarterly','Yearly'],true)}${field('Next date','nextDate',r.nextDate,'date',null,true)}</div></form>`,o=>{let n={...r,...o,amount:num(o.amount),active:r.active!==false,id:r.id||uid()};if(id)data.recurring=data.recurring.map(x=>x.id===id?n:x);else data.recurring.push(n);save();closeModal();render();toast('Recurring schedule saved')})}
window.openRecurring=openRecurring;window.editRecurring=id=>openRecurring(id);window.toggleRecurring=id=>{let r=data.recurring.find(x=>x.id===id);r.active=!r.active;save();render();toast(r.active?'Schedule resumed':'Schedule paused')};
window.removeItem=(key,id)=>{if(confirm('Delete this item?')){data[key]=data[key].filter(x=>x.id!==id);save();render();toast('Item deleted')}};
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
window.exportJSON=()=>download('ledgerly-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');
window.exportCSV=()=>{let rows=[['Date','Type','Amount','Currency','Category','Account','Scope','Note'],...data.transactions.map(t=>[t.date,t.type,t.amount,t.currency,t.category,t.account,t.scope,t.note])];download('ledgerly-transactions-'+today()+'.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};
window.importJSON=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.accounts))throw Error('Invalid backup');if(confirm('Replace current data with this backup?')){data=parsed;save();render();toast('Backup restored')}}catch(err){alert('Could not restore: invalid or incompatible JSON backup.')}e.target.value=''};reader.readAsText(f)};
window.saveRates=()=>{data.baseCurrency=$('#baseCur').value;currencies.forEach(c=>{let v=num($('#rate_'+c).value);if(v>0)data.rates[c]=v});save();$('#globalCurrency').value=data.baseCurrency;render();toast('Currency settings saved')};
window.resetDemo=()=>{if(confirm('Replace all current records with demo data? Export a backup first if needed.')){data=seed();monthFilter=month();save();render();toast('Demo data restored')}};
$('#globalCurrency').value=data.baseCurrency||'BDT';$('#globalCurrency').onchange=()=>render();$('#addTop').onclick=()=>openTx();$('#exportTop').onclick=()=>exportCSV();$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('side-mobile');
nav();render();
})();
</script>
